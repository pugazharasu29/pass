<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bus Pass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }
        .pass-container {
            width: 350px;
            background: white;
            padding: 15px;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .hidden {
            display: none;
        }
        #busPass {
            display: flex;
            align-items: center;
            background: #007BFF;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            position: relative;
            margin-top: 20px;
        }
        #busPass img {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
            margin-right: 15px;
        }
        .pass-details {
            flex-grow: 1;
        }
        #qrCode {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <h2>Digital Bus Pass Generator</h2>
    <div class="pass-container">
        <form id="passForm">
            <input type="text" id="name" placeholder="Enter Name" required><br><br>
            <select id="passType">
                <option value="Student">Student</option>
                <option value="Regular">Regular</option>
            </select><br><br>
            <input type="text" id="validity" placeholder="Validity (e.g., 30 Days)" required><br><br>
            <input type="text" id="route" placeholder="Enter Travel Route" required><br><br>
            <input type="file" id="photo" accept="image/*"><br><br>
            <button type="submit">Generate Pass</button>
        </form>
    </div>
    <div id="busPass" class="hidden">
        <img id="passPhoto" src="" alt="User Photo">
        <div class="pass-details">
            <h3>Digital Bus Pass</h3>
            <p><strong>Name:</strong> <span id="passName"></span></p>
            <p><strong>Pass Type:</strong> <span id="passTypeDisplay"></span></p>
            <p><strong>Valid Till:</strong> <span id="passValidity"></span></p>
            <p><strong>Route:</strong> <span id="passRoute"></span></p>
        </div>
        <div id="qrCode"></div>
    </div>
    <script>
        document.getElementById("passForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let name = document.getElementById("name").value;
            let passType = document.getElementById("passType").value;
            let validity = document.getElementById("validity").value;
            let route = document.getElementById("route").value;
            let photo = document.getElementById("photo").files[0];
            
            if (!name || !validity || !route) {
                alert("Please fill all required fields");
                return;
            }

            let reader = new FileReader();
            reader.onload = function(event) {
                let photoData = event.target.result;
                document.getElementById("passName").innerText = name;
                document.getElementById("passTypeDisplay").innerText = passType;
                document.getElementById("passValidity").innerText = validity;
                document.getElementById("passRoute").innerText = route;
                document.getElementById("passPhoto").src = photoData;
                document.getElementById("busPass").classList.remove("hidden");
                
                let passData = JSON.stringify({ name, passType, validity, route, photoData });
                document.getElementById("qrCode").innerHTML = "";
                new QRCode(document.getElementById("qrCode"), {
                    text: passData,
                    width: 80,
                    height: 80
                });
            };
            
            if (photo) {
                reader.readAsDataURL(photo);
            }
        });
    </script>
</body>
</html>
