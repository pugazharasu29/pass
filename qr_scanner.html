<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Bus Pass - Conductor QR Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: url('pngtree-travel-bus-on-the-way-image_16005789.jpg') no-repeat center center fixed;
            background-size: cover;
            color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            background-color: whitesmoke;
            color: #000000;
            padding: 13px 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        nav .title {
            color: #000000;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bolder;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav li {
            font-size: 18px;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: grey;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            width: 100%;
            max-width: 650px;
            padding: 0 15px;
        }

        .scanner-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .scanner-card h2 {
            margin-bottom: 15px;
            color: #00d2ff;
        }

        #qr-reader {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #00d2ff;
        }

        .manual-verify {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 15px;
        }

        .manual-verify input {
            padding: 10px 15px;
            width: 65%;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .manual-verify button {
            padding: 10px 20px;
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Modal for Scanned Result */
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .result-card {
            background: lightblue;
            border: 3px solid darkblue;
            color: darkblue;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .result-card h3 {
            text-align: center;
            font-size: 24px;
            border-bottom: 2px solid darkblue;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .status-badge {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }

        .result-card p {
            margin: 8px 0;
            font-size: 17px;
        }

        .close-btn {
            display: block;
            width: 100%;
            background: darkblue;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
    <nav>
        <div class="title">
            DIGI BUS PASS
            <img src="png-transparent-public-transport-bus-service-travel-transit-bus-bus-logo-angle-hat-logo.png"
                height="34" width="34">
        </div>
        <ul>
            <li><a href="index.html">Home |</a></li>
            <li><a href="passanger.html">Passenger |</a></li>
            <li><a href="conductor.html">Conductor |</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="scanner-card">
            <h2>Conductor Pass Scanner</h2>
            <p style="margin-bottom: 15px;">Scan passenger's digital QR code to verify validity</p>
            <div id="qr-reader"></div>

            <div class="manual-verify">
                <p style="margin-bottom: 10px; font-size: 14px;">Or Manual Pass Lookup:</p>
                <input type="text" id="manualPassId" placeholder="Enter Pass ID or Mobile">
                <button onclick="verifyManualPass()">Verify</button>
            </div>
        </div>
    </div>

    <!-- Scanned Pass Result Modal -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <span class="status-badge">PASS VERIFIED ✓</span>
            <h3>DIGITAL PASS DETAILS</h3>
            <p><strong>Passenger Name:</strong> <span id="resName"></span></p>
            <p><strong>Pass Type:</strong> <span id="resType"></span></p>
            <p><strong>Validity:</strong> <span id="resValidity"></span></p>
            <p><strong>Route:</strong> <span id="resRoute"></span></p>
            <p><strong>Mobile:</strong> <span id="resMobile"></span></p>
            <button class="close-btn" onclick="closeModal()">Scan Next Pass</button>
        </div>
    </div>

    <script>
        function showPassModal(data) {
            document.getElementById('resName').textContent = data.name || data.full_name || 'N/A';
            document.getElementById('resType').textContent = data.pass_type || 'N/A';
            document.getElementById('resValidity').textContent = data.validity || `${data.start_date || ''} to ${data.end_date || ''}`;
            document.getElementById('resRoute').textContent = data.route || `${data.route_number || ''} (${data.source_location || ''} to ${data.destination_location || ''})`;
            document.getElementById('resMobile').textContent = data.mobile || data.mobile_number || 'N/A';

            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function onScanSuccess(decodedText, decodedResult) {
            try {
                // Try parsing JSON payload
                const passData = JSON.parse(decodedText);
                showPassModal(passData);
            } catch (e) {
                // Raw text scanned
                showPassModal({
                    name: 'Scanned Pass',
                    pass_type: 'Digital Pass',
                    validity: 'Active',
                    route: decodedText,
                    mobile: 'Verified'
                });
            }
        }

        function verifyManualPass() {
            const passId = document.getElementById('manualPassId').value.trim();
            if (!passId) {
                alert('Please enter a Pass ID or Mobile Number');
                return;
            }

            fetch(`get_pass_data.php?id=${passId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success' && data.passData) {
                        showPassModal(data.passData);
                    } else {
                        alert('No matching pass record found!');
                    }
                })
                .catch(err => alert('Error checking pass details: ' + err.message));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const html5QrcodeScanner = new Html5QrcodeScanner(
                "qr-reader",
                { fps: 10, qrbox: { width: 250, height: 250 } },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, (errorMessage) => {
                // Silence scanner noise
            });
        });
    </script>
</body>

</html>
