<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #e0f7ff;
    background: url('pngtree-travel-bus-on-the-way-image_16005789.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    width: 350px;
    text-align: center;
}
input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}
button {
    background: black;
    color: white;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    width: 100%;
    border-radius: 5px;
}
button:hover {
    background: #333;
}
.hidden {
    display: none;
}

    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        
        <!-- Step 1: Enter Email -->
        <div id="step1">
            <input type="email" id="email" placeholder="Enter your email" required>
            <button onclick="sendResetCode()">Send Reset Code</button>
        </div>

        <!-- Step 2: Enter Verification Code -->
        <div id="step2" class="hidden">
            <input type="text" id="verification-code" placeholder="Enter Verification Code">
            <button onclick="verifyCode()">Verify Code</button>
        </div>

        <!-- Step 3: Reset Password -->
        <div id="step3" class="hidden">
            <input type="password" id="new-password" placeholder="Enter New Password">
            <button onclick="resetPassword()">Reset Password</button>
        </div>

        <p id="message"></p>
    </div>

    <script>
     function sendResetCode() {
    const email = document.getElementById("email").value;
    if (!email) {
        alert("Please enter your email!");
        return;
    }

    fetch('send_code.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
            // Store email in hidden field for next steps
            sessionStorage.setItem('resetEmail', email);
        }
        alert(data.message);
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Server error! Please try again.");
    });
}

function verifyCode() {
    const code = document.getElementById("verification-code").value;
    const email = sessionStorage.getItem('resetEmail');

    fetch('verify_code.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, email: email })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("step3").classList.remove("hidden");
        } else {
            alert(data.message || "Invalid code!");
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Verification failed!");
    });
}

function resetPassword() {
    const email = sessionStorage.getItem('resetEmail');
    const newPassword = document.getElementById("new-password").value;

    if (newPassword.length < 6) {
        alert("Password must be at least 6 characters!");
        return;
    }

    fetch('reset_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: newPassword })
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message);
        if (data.success) {
            sessionStorage.removeItem('resetEmail');
            window.location.href = "login.html";
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Password reset failed!");
    });
}
    </script>
</body>
</html>
