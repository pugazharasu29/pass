    <div class="bus-pass" id="busPass">

    <script>
    // Function to parse URL parameters
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const passData = params.get('data');
        if (!passData) return null;
        
        try {
            return JSON.parse(decodeURIComponent(passData));
        } catch (e) {
            console.error('Error parsing pass data:', e);
            return null;
        }
    }

    // Function to display pass from QR data
    function displayPassFromQR() {
        const passData = getUrlParams();
        if (!passData) {
            showErrorMessage('Invalid or missing pass data');
            return;
        }
        displayPass(passData);
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', () => {
        displayPassFromQR();
    });
    </script>
