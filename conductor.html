                <h2>Conductor Login</h2>
                <form action="db_connection.php" method="post" onsubmit="return validateLogin()">
                    <div class="textbox">
                        <input type="text" placeholder="Username" name="username" id="username" required>
                    </div>
                    <div class="textbox">
                        <input type="password" placeholder="Password" name="password" id="password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <p id="error-message" style="color:red; margin-top:10px;"></p>
            </div>
        </div>
    </div>
    <script>
    function validateLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
    
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "db_connection.php", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                if (xhr.responseText.trim() === "success") {
                    window.location.href = "qr_scanner.html"; // Redirect on success
                } else {
                    document.getElementById("error-message").textContent = xhr.responseText;
                }
            }
        };
        xhr.send("username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password));
    
        return false; // Prevent form submission
    }
</script>
