<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>
    <style>
        .form-container {
            background: rgba(255, 255, 255, 0.8); /* Light background */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Dark shadow */
            width: 100%;
            max-height: 100vh;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], input[type="email"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-container {
            display: inline;
            justify-content:center;
            margin-top: 20px;
        }
        input[type="submit"] {
            background: black; /* Changed button color to black */
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="submit"]:hover {
            background: #333; /* Slightly lighter black on hover */
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
    <script>
      
      document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("personalDetailsForm").addEventListener("submit", function (event) {
        event.preventDefault(); // Prevent page reload
        savePersonalData();
    });
});

function savePersonalData() {
    let formData = new FormData(document.getElementById("personalDetailsForm"));

    fetch("save_personal_details.php", {
        method: "POST",
        body: formData,
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            alert("Personal details saved successfully.");
            window.location.href = "address-detail.html"; // Redirect to the next page
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => console.error("Error submitting form:", error));
}



    </script>
</head>
<body>
    <div class="form-container">
        <form id="personalDetailsForm" action="save_personal_details.php" onsubmit="event.preventDefault(); savePersonalData();">
            <h2>Personal Details</h2>
            <div class="form-group">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" required>
            </div>
            <div class="form-group">
                <label for="guardian-name">Father’s/Mother’s/Guardian’s Name:</label>
                <input type="text" id="guardian-name" name="guardian-name" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="aadhaar-number">Aadhaar Number:</label>
                <input type="text" id="aadhaar-number" name="aadhaar-number">
            </div>
            <div class="form-group">
                <label for="mobile-number">Mobile Number:</label>
                <input type="number" id="mobile-number" name="mobile-number" required>
            </div>
            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="submit-container">
                <input type="submit" value="Next">
            </div>
            
        </form>
    </div>
</body>
</html>
