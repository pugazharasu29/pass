
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Bus Pass</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            flex-direction: column;
        }
        .container {
            text-align: center;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: black;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #333;
        }
        .bus-pass {
            width: 450px;
            height: 280px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            position: relative;
            justify-content: space-between;
            align-items: center;
        }
        .photo {
            width: 100px;
            height: 100px;
            border-radius: 5px;
            object-fit: cover;
        }
        .details {
            flex-grow: 1;
            text-align: left;
            padding: 0 10px;
        }
        .qr-code {
            width: 80px;
            height: 80px;
        }
        .header {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn" onclick="fetchBusPass()">Generate Pass</button>
        <div id="pass-container" style="display:none; margin-top: 20px;"></div>
    </div>

    <script>
        function fetchBusPass() {
            fetch("fetchbuspass.php")
                .then(response => response.json())
                .then(data => {
                    console.log("Fetched Data:", data); // Debugging
                    if (data.status === "success") {
                        displayBusPass(data);
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => console.error("Error fetching bus pass:", error));
        }

        function displayBusPass(data) {
            const qrCodeURL = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${decodeURIComponent(atob(data.qr_data))}`;
            const photoURL = data.photo ? `uploads/${data.photo}` : "default.png"; // Ensure correct path
            
            document.getElementById("pass-container").innerHTML = `
                <div class='bus-pass' id="bus-pass">
                    <img src="${photoURL}" class="photo" alt="User Photo">
                    <div class='details'>
                        <div class='header'>DIGI BUS PASS</div>
                        <p><strong>Name:</strong> ${data.name}</p>
                        <p><strong>Pass Type:</strong> ${data.pass_type}</p>
                        <p><strong>Validity:</strong> ${data.validity}</p>
                        <p><strong>Route:</strong> ${data.route}</p>
                    </div>
                    <img src="${qrCodeURL}" class='qr-code' alt="QR Code">
                </div>
                <button class='btn' onclick='downloadPass()'>Download Pass</button>
            `;
            document.getElementById("pass-container").style.display = "block";
        }
        
        function downloadPass() {
            html2canvas(document.querySelector("#bus-pass")).then(canvas => {
                let link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "bus_pass.png";
                link.click();
            });
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
