<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Pass System</title>
    <style>
        .form-container {
            background: rgba(255, 255, 255, 0.8); /* Light background */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Dark shadow */
            width: 100%;
            max-height: 100vh;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], input[type="email"], input[type="number"], select, textarea, input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        input[type="submit"], input[type="button"] {
            background: black; /* Changed button color to black */
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="submit"]:hover, input[type="button"]:hover {
            background: #333; /* Slightly lighter black on hover */
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
    <script>
        // Handle form submission for all sections
        function submitCombinedForm(formId, url) {
            document.getElementById(formId).addEventListener("submit", function(event) {
                event.preventDefault();
                const formData = new FormData(this);
                fetch(url, {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        alert("Submitted successfully!");
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => console.error("Error:", error));
            });
        }

        // Submit the combined form
        submitCombinedForm("combinedForm", "save_combined_data.php");
    </script>
</head>
<body>

    <form id="combinedForm" enctype="multipart/form-data">

        <!-- Personal Details Form -->
        <div class="form-container">
            <h2>Personal Details</h2>
            <div class="form-group">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" required>
            </div>
            <div class="form-group">
                <label for="guardian-name">Guardian’s Name:</label>
                <input type="text" id="guardian-name" name="guardian_name" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="aadhaar-number">Aadhaar Number:</label>
                <input type="text" id="aadhaar-number" name="aadhaar_number">
            </div>
            <div class="form-group">
                <label for="mobile-number">Mobile Number:</label>
                <input type="number" id="mobile-number" name="mobile_number" required>
            </div>
            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" name="email" required>
            </div>
        </div>

        <!-- Address Details Form -->
        <div class="form-container">
            <h2>Address Details</h2>
            <div class="form-group">
                <label for="address">Residential Address:</label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="city">District/City:</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="form-group">
                <label for="state">State:</label>
                <input type="text" id="state" name="state" required>
            </div>
            <div class="form-group">
                <label for="pincode">Pincode:</label>
                <input type="number" id="pincode" name="pincode" required>
            </div>
        </div>

        <!-- Pass Category Form -->
        <div class="form-container">
            <h2>Pass Category</h2>
            <div class="form-group">
                <label for="pass-category">Pass Category:</label>
                <select id="pass-category" name="pass_category" required>
                    <option value="student">Student Pass</option>
                    <option value="senior-citizen">Senior Citizen Pass</option>
                    <option value="government-employee">Government Employee Pass</option>
                    <option value="disability">Disability Pass</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group" id="other-category-group" style="display: none;">
                <label for="other-category">Specify Other Category:</label>
                <input type="text" id="other-category" name="other_category">
            </div>
        </div>

        <!-- Bus Pass Details Form -->
        <div class="form-container">
            <h2>Bus Pass Details</h2>
            <div class="form-group">
                <label for="pass-type">Type of Pass:</label>
                <select id="pass-type" name="pass_type" required>
                    <option value="daily">Daily</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                </select>
            </div>
            <div class="form-group">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date" name="end_date" required>
            </div>
            <div class="form-group">
                <label for="route-number">Route Number:</label>
                <input type="text" id="route-number" name="route_number" required>
            </div>
            <div class="form-group">
                <label for="source-location">Source Location:</label>
                <input type="text" id="source-location" name="source_location" required>
            </div>
            <div class="form-group">
                <label for="destination-location">Destination Location:</label>
                <input type="text" id="destination-location" name="destination_location" required>
            </div>
            <div class="form-group">
                <label for="timing">Preferred Timing:</label>
                <input type="text" id="timing" name="timing" required>
            </div>
        </div>

        <!-- Travel Details Form -->
        <div class="form-container">
            <h2>Travel Details</h2>
            <div class="form-group">
                <label for="route-details">Route Details:</label>
                <textarea id="route-details" name="route_details" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="starting-bus-stop">Starting Bus Stop:</label>
                <input type="text" id="starting-bus-stop" name="starting_bus_stop" required>
            </div>
            <div class="form-group">
                <label for="ending-bus-stop">Ending Bus Stop:</label>
                <input type="text" id="ending-bus-stop" name="ending_bus_stop" required>
            </div>
            <div class="form-group">
                <label for="preferred-travel-route">Preferred Travel Route:</label>
                <input type="text" id="preferred-travel-route" name="preferred_travel_route" required>
            </div>
            <div class="form-group">
                <label for="validity-period">Validity Period:</label>
                <input type="text" id="validity-period" name="validity_period" required>
            </div>
        </div>

        <!-- Documents Upload Form -->
        <div class="form-container">
            <h2>Documents Upload</h2>
            <div class="form-group">
                <label for="aadhaar-doc">Upload Aadhaar Card:</label>
                <input type="file" id="aadhaar-doc" name="aadhaar_doc" required>
            </div>
            <div class="form-group">
                <label for="photo">Upload Photograph:</label>
                <input type="file" id="photo" name="photo" required>
            </div>
        </div>

        <!-- Payment Details Form -->
        <div class="form-container">
            <h2>Payment Details</h2>
            <div class="form-group">
                <label for="payment-method">Payment Method:</label>
                <select id="payment-method" name="payment_method" required>
                    <option value="credit-card">Credit Card</option>
                    <option value="debit-card">Debit Card</option>
                    <option value="net-banking">Net Banking</option>
                    <option value="upi">UPI</option>
                    <option value="cash">Cash</option>
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" required>
            </div>
            <div class="form-group">
                <label for="dummy-payment">QR Code for Payment:</label>
                <img src="Screenshot 2025-01-27 095551.png" alt="QR Code" id="dummy-payment">
            </div>
        </div>

        <!-- Declaration Form -->
        <div class="form-container">
            <h2>Declaration</h2>
            <div class="form-group">
                <label for="declaration">I hereby declare that the information provided is true and correct to the best of my knowledge.</label>
                <input type="checkbox" id="declaration" name="declaration" required>
            </div>
        </div>

        <div class="submit-container">
            <input type="submit" value="Submit">
        </div>

    </form>

</body>
</html>
