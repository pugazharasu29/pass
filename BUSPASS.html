<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bus Pass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .bus-pass {
            width: 300px;
            background: #007BFF;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            position: relative;
            margin: auto;
            display: none;
        }
        .bus-pass img {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
        }
        .qr-code {
            width: 80px;
            height: 80px;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        .error-message {
            color: red;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <h2>Your Digital Bus Pass</h2>
    
    <button id="generatePass">Generate Pass</button>
    <p id="errorMessage" class="error-message"></p>

    <!-- Bus Pass Card -->
    <div id="busPass" class="bus-pass">
        <h3>Digital Bus Pass</h3>
        <p><strong>Name:</strong> <span id="passName"></span></p>
        <p><strong>Pass Type:</strong> <span id="passTypeDisplay"></span></p>
        <p><strong>Valid Till:</strong> <span id="passValidity"></span></p>
        <img id="passPhoto" src="" alt="User Photo">
        <div id="qrCode" class="qr-code"></div>
    </div>
    
    <button onclick="downloadPass()" id="downloadBtn" style="display: none;">Download Pass</button>

    <script>
        document.getElementById("generatePass").addEventListener("click", function() {
            fetch('fetch_pass.php')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("busPass").style.display = "none";
                        document.getElementById("downloadBtn").style.display = "none";
                        document.getElementById("errorMessage").textContent = data.error;
                        document.getElementById("errorMessage").style.display = "block";
                        return;
                    }

                    // Populate pass details
                    document.getElementById("passName").textContent = data.data.name;
                    document.getElementById("passTypeDisplay").textContent = data.data.pass_type;
                    document.getElementById("passValidity").textContent = data.data.validity;
                    document.getElementById("passPhoto").src = data.data.photo;

                    // Generate QR Code
                    document.getElementById("qrCode").innerHTML = "";
                    new QRCode(document.getElementById("qrCode"), data.data.name + " | " + data.data.pass_type + " | Valid: " + data.data.validity);

                    // Show Pass
                    document.getElementById("busPass").style.display = "block";
                    document.getElementById("downloadBtn").style.display = "block";
                })
                .catch(error => {
                    document.getElementById("errorMessage").textContent = "Error fetching data!";
                    document.getElementById("errorMessage").style.display = "block";
                });
        });

        function downloadPass() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Digital Bus Pass", 20, 20);
            doc.text("Name: " + document.getElementById("passName").textContent, 20, 40);
            doc.text("Pass Type: " + document.getElementById("passTypeDisplay").textContent, 20, 50);
            doc.text("Valid Till: " + document.getElementById("passValidity").textContent, 20, 60);

            // Get QR Code Image
            const qrCanvas = document.querySelector("#qrCode canvas");
            if (qrCanvas) {
                const qrDataURL = qrCanvas.toDataURL("image/png");
                doc.addImage(qrDataURL, "PNG", 20, 70, 50, 50);
            }

            doc.save("Digi_Bus_Pass.pdf");
        }
    </script>
</body>
</html>
