    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        function showPaymentPortal() {
            const method = document.getElementById('payment-method').value;
            const portal = document.getElementById('paymentPortal');
            const overlay = document.getElementById('paymentOverlay');

            if (method === 'cash') {
                closePayment();
                return;
            }

            // Show all elements
            portal.classList.add('active');
            overlay.classList.add('active');

            // Hide all payment forms
            document.querySelectorAll('.payment-method-form').forEach(form => {
                form.classList.remove('active');
            });

            // Show relevant form
            if (method === 'credit-card' || method === 'debit-card') {
                document.getElementById('creditCardForm').classList.add('active');
            } else if (method === 'upi') {
                document.getElementById('upiForm').classList.add('active');
            } else if (method === 'net-banking') {
                document.getElementById('netBankingForm').classList.add('active');
            }
        }

        function closePayment() {
            document.getElementById('paymentPortal').classList.remove('active');
            document.getElementById('paymentOverlay').classList.remove('active');
        }

        async function processPayment() {
            const amount = Number(document.getElementById('amount').value);
            if (!Number.isFinite(amount) || amount <= 0) {
                alert('Enter a valid pass amount before continuing.');
                return;
            }
            try {
                const orderResponse = await fetch('/api/payment/order', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });
                const order = await orderResponse.json();
                if (!orderResponse.ok) throw new Error(order.message || 'Could not start payment.');
                const checkout = new Razorpay({
                    key: order.key_id, amount: order.amount, currency: order.currency,
                    name: 'Digi Bus Pass', description: 'Bus pass payment', order_id: order.order_id,
                    handler: async function (result) {
                        const verifyResponse = await fetch('/api/payment/verify', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(result)
                        });
                        const verified = await verifyResponse.json();
                        if (!verifyResponse.ok) { alert(verified.message || 'Payment verification failed.'); return; }
                        let paymentField = document.getElementById('razorpay_payment_id');
                        if (!paymentField) {
                            paymentField = document.createElement('input');
                            paymentField.type = 'hidden'; paymentField.id = 'razorpay_payment_id';
                            paymentField.name = 'razorpay_payment_id';
                            document.getElementById('busPassForm').appendChild(paymentField);
                        }
                        paymentField.value = verified.payment_id;
                        closePayment();
                        document.getElementById('busPassForm').requestSubmit();
                    },
                    prefill: { name: document.getElementById('full-name')?.value || '',
                               email: document.querySelector('[name="email"]')?.value || '',
                               contact: document.querySelector('[name="mobile_number"]')?.value || '' },
                    theme: { color: '#3399cc' }
                });
                checkout.open();
            } catch (error) {
                alert(error.message || 'Payment could not be started. Please try again.');
            }
        }

        // Close payment portal when clicking outside
        document.getElementById('paymentOverlay').addEventListener('click', closePayment);
        document.getElementById("busPassForm").addEventListener("submit", function (event) {
            event.preventDefault();

            let formData = new FormData(this);

            fetch("save_combined_data.php", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        alert("Bus Pass Application Submitted Successfully!");
                        const passId = data.id ? data.id : '';
                        window.location.href = "buspassgenerator002.html?id=" + passId + "&created=1";
                        document.getElementById("busPassForm").reset();
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An error occurred while submitting the form.");
                });
        });
    </script>
